<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <header class="top-bar">
            <h1 class="page-title">Categories</h1>
            <a th:href="@{/categories/new}" class="btn btn-primary">+ New Category</a>
        </header>
        <main class="content">

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(categories)}" class="empty-state">
                <p>No categories yet. <a th:href="@{/categories/new}">Create your first one.</a></p>
            </div>

            <section th:if="${!#lists.isEmpty(categories)}" class="section-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.name}">Name</td>
                            <td>
                                <span th:if="${cat.type != null}"
                                      th:text="${cat.type}"
                                      th:classappend="${cat.type.name() == 'INCOME'} ? 'badge badge-income' : 'badge badge-expense'">
                                </span>
                                <span th:if="${cat.type == null}" class="badge badge-neutral">Both</span>
                            </td>
                            <td class="text-center">
                                <div class="action-btns">
                                    <a th:href="@{/categories/{id}/edit(id=${cat.id})}"
                                       class="btn btn-sm btn-ghost">Edit</a>
                                    <form th:action="@{/categories/{id}/delete(id=${cat.id})}"
                                          method="post" style="display:inline"
                                          onsubmit="return confirm('Delete this category?')">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>
</div>
</body>
</html>
