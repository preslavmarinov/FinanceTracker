<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${budget.id == null ? 'New Budget' : 'Edit Budget'}, '')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="main-area">
        <header class="top-bar">
            <h1 class="page-title"
                th:text="${budget.id == null ? 'New Budget' : 'Edit Budget'}">Budget</h1>
            <a th:href="@{/budgets}" class="btn btn-ghost">&larr; Back</a>
        </header>
        <main class="content">
            <section class="section-card form-card form-card-sm">

                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

                <form th:action="${budget.id == null ? '/budgets/new' : '/budgets/' + budget.id + '/edit'}"
                      th:object="${budget}"
                      method="post" class="main-form">

                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select id="category" th:field="*{category.id}" required>
                            <option value="">Select a category</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"></option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('category')}"
                              th:errors="*{category}"></span>
                    </div>

                    <div class="form-group">
                        <label for="monthlyLimit">Monthly Limit <span class="required">*</span></label>
                        <div class="input-prefix">
                            <span class="prefix-symbol">$</span>
                            <input type="number" id="monthlyLimit" th:field="*{monthlyLimit}"
                                   step="0.01" min="0.01" placeholder="0.00" required/>
                        </div>
                        <span class="field-error" th:if="${#fields.hasErrors('monthlyLimit')}"
                              th:errors="*{monthlyLimit}"></span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${budget.id == null ? 'Create Budget' : 'Save Changes'}">Save</button>
                        <a th:href="@{/budgets}" class="btn btn-ghost">Cancel</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
</body>
</html>
