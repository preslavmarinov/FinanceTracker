<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile', 'profile.css')}"></head>
<body>
<div class="app-wrapper">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  <div class="main-area">
    <header class="top-bar">
      <h1 class="page-title">My Profile</h1>
    </header>
    <main class="content">

      <div class="profile-hero">
        <div class="profile-avatar"
             th:text="${currentUser.firstName.substring(0,1).toUpperCase() + currentUser.lastName.substring(0,1).toUpperCase()}">AB</div>
        <div class="profile-hero-info">
          <div class="profile-hero-name"
               th:text="${currentUser.firstName + ' ' + currentUser.lastName}">Full Name</div>
          <div class="profile-hero-meta">
            <span th:text="'@' + ${currentUser.username}">@username</span>
            <span class="meta-sep">·</span>
            <span th:text="'Member since ' + ${#temporals.format(memberSince, 'MMM yyyy')}">Member since</span>
          </div>
        </div>
      </div>

      <div class="profile-grid">
        <section class="section-card">
          <h2 class="card-section-title">Personal Info</h2>

          <div th:if="${profileSuccess}" class="alert alert-success" th:text="${profileSuccess}"></div>
          <div th:if="${profileError}" class="alert alert-error" th:text="${profileError}"></div>

          <form th:action="@{/profile/update}" th:object="${profileDto}" method="post" class="main-form">
            <div class="auth-name-row">
              <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}"
                       placeholder="John" required/>
                <span class="field-error" th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"></span>
              </div>
              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}"
                       placeholder="Doe" required/>
                <span class="field-error" th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"></span>
              </div>
            </div>
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" th:field="*{username}"
                     placeholder="yourusername" required minlength="3"/>
              <span class="field-error" th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}"></span>
            </div>
            <div class="form-group">
              <label>Email</label>
              <div class="field-static" th:text="${currentUser.email}">email@example.com</div>
              <small class="field-hint">Email cannot be changed.</small>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </section>

        <section class="section-card">
          <h2 class="card-section-title">Change Password</h2>

          <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}"></div>
          <div th:if="${passwordError}" class="alert alert-error" th:text="${passwordError}"></div>

          <form th:action="@{/profile/password}" th:object="${passwordDto}" method="post" class="main-form">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" th:field="*{currentPassword}"
                     placeholder="Enter current password" required/>
              <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}"
                    th:errors="*{currentPassword}"></span>
            </div>
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <input type="password" id="newPassword" th:field="*{newPassword}"
                     placeholder="At least 6 characters" required minlength="6"/>
              <span class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                    th:errors="*{newPassword}"></span>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm New Password</label>
              <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                     placeholder="Repeat new password" required/>
              <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                    th:errors="*{confirmPassword}"></span>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
          </form>
        </section>

      </div>
    </main>
  </div>
</div>
</body>
</html>
